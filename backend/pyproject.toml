[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelli-credit-backend"
version = "0.1.0"
description = "FastAPI backend for Intelli-Credit Copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncssh>=2.17.0",
  "beautifulsoup4>=4.13.0",
  "fastapi>=0.115.0",
  "google-genai>=1.16.1",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "pydantic>=2.10.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.26.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.5",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "numpy>=1.26.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.1",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]
bench = [
  "docling>=2.78.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
